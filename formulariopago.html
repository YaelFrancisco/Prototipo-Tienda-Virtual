<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natlan Studios - App</title>
    <link rel="icon" href="img/logo-001.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        .section-container {
            background-color: #1e293b;
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
            padding: 2rem;
            width: 90%;
            max-width: 600px;
            text-align: center;
            margin: 20px auto;
            position: relative;
        }
        @media (max-width: 640px) {
            .section-container {
                padding: 1.5rem;
                width: 95%;
            }
        }
        .section-container h1 {
            font-size: 2.25rem;
            font-weight: 700;
            color: #6ee7b7;
            margin-bottom: 1.5rem;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
        }
        .section-container h2 {
            font-size: 1.875rem;
            font-weight: 700;
            color: #6ee7b7;
            margin-bottom: 1.5rem;
        }
        .section-container p {
            font-size: 1.125rem;
            color: #cbd5e0;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }
        .action-button {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            background-color: #10b981;
            color: #0f172a;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: none;
            cursor: pointer;
            margin-top: 1rem;
        }
        .action-button:hover {
            background-color: #059669;
            transform: translateY(-2px);
        }
        #main-return-button {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            background-color: #4a5568;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background-color 0.3s ease;
            font-size: 0.8rem;
            border: none;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
        }
        #main-return-button:hover {
            background-color: #718096;
        }
        #main-return-button svg {
            width: 1rem;
            height: 1rem;
        }
        .payment-form {
            text-align: left;
            margin-top: 1.5rem;
        }
        .payment-form label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #6ee7b7;
        }
        .payment-form input[type="text"],
        .payment-form input[type="email"],
        .payment-form input[type="tel"],
        .payment-form input[type="number"],
        .payment-form input[type="password"],
        .payment-form select {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border-radius: 0.375rem;
            border: 1px solid #4a5568;
            background-color: #0f172a;
            color: #f8fafc;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .payment-form input:focus,
        .payment-form select:focus {
            outline: none;
            border-color: #6ee7b7;
            box-shadow: 0 0 0 2px rgba(110, 231, 183, 0.5);
        }
        .payment-form .btn-cpago {
            background-color: #a855f7;
            color: #f8fafc;
            width: 100%;
        }
        .payment-form .btn-cpago:hover {
            background-color: #9333ea;
        }
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15,23,42,0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loader {
            border: 8px solid #1e293b;
            border-top: 8px solid #6ee7b7;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            animation: spin 1s linear infinite;
            margin-bottom: 1.5rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg);}
            100% { transform: rotate(360deg);}
        }
        .loading-text {
            color: #6ee7b7;
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 2px;
            font-weight: 600;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- Botón general de regresar -->
    <button id="main-return-button" onclick="window.location.href='index.html'">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4">
            <path fill-rule="evenodd" d="M11.03 2.22a.75.75 0 0 1 0 1.06L4.56 11.25l6.47 7.97a.75.75 0 1 1-1.06 1.06l-7-8.25a.75.75 0 0 1 0-1.06l7-8.25a.75.75 0 0 1 1.06 0ZM7.5 12a.75.75 0 0 1 .75-.75h14.25a.75.75 0 0 1 0 1.5H8.25A.75.75 0 0 1 7.5 12Z" clip-rule="evenodd" />
        </svg>
        Inicio
    </button>

    <!-- Sección de Error en el Pago -->
    <section id="error-section" class="section-container">
        <h1>¡Error en el Pago!</h1>
        <p>Ocurrió un problema al procesar tu pago. Por favor, intenta nuevamente.</p>
        <button id="retry-payment-button" class="action-button">Volver al Formulario</button>
        <button id="back-to-shop-from-error" class="action-button" style="margin-top: 1rem;">Volver a la Tienda</button>
    </section>

    <!-- Sección del Formulario de Pago -->
    <section id="payment-form-section" class="section-container hidden">
        <h1>Confirmación de Pago</h1>
        <form id="payment-form" class="payment-form" novalidate>
            <!-- Full Name Input with Icon -->
            <label for="nombre"><i class="fas fa-user mr-2"></i>Nombre Completo</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required>

            <!-- Email Input with Icon -->
            <label for="email"><i class="fas fa-envelope mr-2"></i>Correo Electrónico</label>
            <input type="email" id="email" name="email" placeholder="Ingresa tu correo" required>

            <!-- Address Input with Icon -->
            <label for="direccion"><i class="fas fa-address-card mr-2"></i>Dirección</label>
            <input type="text" id="direccion" name="direccion" placeholder="Ingresa tu dirección" required>

            <!-- Payment Method Select with Icon -->
            <label for="metodo-pago"><i class="fas fa-dollar-sign mr-2"></i>Método de Pago</label>
            <select id="metodo-pago" name="metodo-pago" required>
                <option value="tarjeta">Tarjeta de Crédito/Débito</option>
                <option value="paypal">PayPal</option>
                <option value="transferencia">Transferencia Bancaria</option>
            </select>

            <!-- Card Number Input with Icon -->
            <label for="numero-tarjeta"><i class="fas fa-credit-card mr-2"></i>Número de Tarjeta</label>
            <input type="tel" id="numero-tarjeta" name="numero-tarjeta" placeholder="XXXX-XXXX-XXXX-XXXX" required>

            <!-- Expiration Date Input with Icon -->
            <label for="fecha-vencimiento"><i class="fas fa-calendar-alt mr-2"></i>Fecha de Vencimiento (MM/AA)</label>
            <input type="tel" id="fecha-vencimiento" name="fecha-vencimiento" placeholder="MM/AA" required>

            <!-- CVV Input with Icon -->
            <label for="cvv"><i class="fas fa-lock mr-2"></i>CVV</label>
            <input type="number" id="cvv" name="cvv" placeholder="XXX" required>

            <button type="submit" name="procesar_pago" class="action-button btn-cpago">Confirmar Pago</button>
        </form>
    </section>

    <!-- Sección de Confirmación de Pago -->
    <section id="confirmation-section" class="section-container hidden">
        <h1>¡Gracias por tu compra!</h1>
        <p>Tu pago ha sido procesado con éxito. Pronto recibirás un correo con los detalles de tu compra.</p>
        <button id="back-to-shop-from-confirmation" class="action-button">Volver al menú</button>
    </section>

    <!-- Pantalla de carga animada -->
    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="loader"></div>
        <span class="loading-text">Cargando...</span>
    </div>

    <script>
        // --- Global Variables and DOM Elements ---
        const errorSection = document.getElementById('error-section');
        const paymentFormSection = document.getElementById('payment-form-section');
        const confirmationSection = document.getElementById('confirmation-section');
        const loadingOverlay = document.getElementById('loading-overlay');

        // Buttons for navigation
        const retryPaymentButton = document.getElementById('retry-payment-button');
        const backToShopFromError = document.getElementById('back-to-shop-from-error');
        const backToShopFromConfirmation = document.getElementById('back-to-shop-from-confirmation');

        // Payment Form elements
        const paymentForm = document.getElementById('payment-form');
        const paymentEmailInput = document.getElementById('email');

        // --- Utility Functions ---

        function showLoading() {
            loadingOverlay.classList.remove('hidden');
        }
        function hideLoading() {
            loadingOverlay.classList.add('hidden');
        }
        function showSection(sectionElement) {
            showLoading();
            setTimeout(() => {
                errorSection.classList.add('hidden');
                paymentFormSection.classList.add('hidden');
                confirmationSection.classList.add('hidden');
                sectionElement.classList.remove('hidden');
                hideLoading();
            }, 500);
        }

        // --- Event Listeners ---

        document.addEventListener('DOMContentLoaded', () => {
            // Initial view: show payment form section
            showSection(paymentFormSection);

            // Error section buttons
            retryPaymentButton.addEventListener('click', () => showSection(paymentFormSection));
            backToShopFromError.addEventListener('click', () => { window.location.href = 'index.html'; });

            // Confirmation section buttons
            backToShopFromConfirmation.addEventListener('click', () => { window.location.href = 'index.html'; });

            // Payment Form submission (simulated)
            paymentForm.addEventListener('submit', (event) => {
                event.preventDefault();
                const emailValue = paymentEmailInput.value.trim();
                const nombre = document.getElementById('nombre').value.trim();
                const numeroTarjeta = document.getElementById('numero-tarjeta').value.trim();

                if (!nombre || !emailValue || !numeroTarjeta) {
                    showSection(errorSection);
                    return;
                }

                showLoading();
                setTimeout(() => {
                    const paymentRecord = {
                        nombre,
                        email: emailValue,
                        numeroTarjeta,
                        fecha: new Date().toISOString(),
                        metodo: document.getElementById('metodo-pago').value
                    };
                    localStorage.setItem('natlan_ultimo_pago', JSON.stringify(paymentRecord));

                    if (emailValue.includes('error')) {
                        showSection(errorSection);
                    } else {
                        showSection(confirmationSection);
                    }
                }, 1500);
            });
        });
    </script>
</body>
</html>
